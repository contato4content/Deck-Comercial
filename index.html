<title>4Content · Deck Comercial</title>
<style>
  :root { --bg:#0e0e10; --fg:#f2f2f2; --muted:#9a9aa2; --line:#26262b; --card:#17171a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:40px 16px 80px; }
  header { margin-bottom:40px; }
  h1 { font-size:28px; margin:0 0 4px; }
  h2 { font-size:22px; margin:56px 0 16px; padding-top:24px; border-top:1px solid var(--line); }
  h3 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 12px; }
  p.sub { color:var(--muted); margin:0; }
  img, video { display:block; width:100%; height:auto; border-radius:8px; background:var(--card); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .grid figure { margin:0; }
  figcaption { font-size:13px; color:var(--muted); margin-top:6px; word-break:break-word; }
  .avatars { display:flex; gap:16px; flex-wrap:wrap; }
  .avatars figure { margin:0; width:80px; text-align:center; }
  .avatars img { width:64px; height:64px; border-radius:50%; object-fit:cover; margin:0 auto; }
  a { color:inherit; }
</style>
</head>
